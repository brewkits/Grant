kotlin.mpp.enableCInteropCommonization=true
android.useAndroidX=true
kotlin.native.macos.sdk.path = /Applications/Xcode.app/Contents/Developer
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
kotlin.suppressGradlePluginWarnings=IncorrectCompileOnlyDependencyWarning

# Dokka 2.x: opt into the V2 Gradle plugin. V1 is deprecated and is removed in Dokka
# 2.1.0; the aggregated `dokka { }` extension and `dokka(project(...))` dependency
# configuration used in the root build script are V2-only APIs.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled

# Lint bundled with AGP 8.13 cannot read Kotlin 2.4 metadata reliably.
# Upgrade Lint independently; AGP and the Android build model remain unchanged.
android.experimental.lint.version=9.5.1
