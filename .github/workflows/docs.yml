name: API Docs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Allow one concurrent deployment; a newer tag supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # macOS: the aggregated publication includes the Apple targets of all 10 Kotlin modules
    # (grant-bom is a pure Maven BOM with no Kotlin/Dokka involvement), and Kotlin/Native
    # cannot cross-compile those targets on Linux.
    runs-on: macos-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate aggregated API reference
        run: ./gradlew dokkaGenerate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
