name: "Coverage Report (KMP & iOS)"

# Not a pull_request trigger, unlike ci.yml/ios.yml/code-quality.yml (#78) — this is a coverage
# report, not a merge gate, so push-to-main plus an on-demand workflow_dispatch is the right
# scope; there's no correctness reason to block a PR on it. (An earlier version of this comment
# cited "cost control" as the reason it wasn't PR-gated — that reasoning doesn't hold on this
# public repo either; see ci.yml's header for why.)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Every module with the Kover plugin applied. grant-core-koin is NOT here on purpose,
      # not by oversight — it has no Kover plugin in its build.gradle.kts at all (verified by
      # grep, not assumed); wiring that up is tracked separately rather than folded in here.
      # grant-desktop/desktop-harness have no Kover for a different reason: see grant-desktop's
      # build.gradle.kts comment (a coverage floor on a thin bridge whose real behavior only a
      # signed .app against real TCC can exercise would measure the wrong thing).
      - name: Run KMP Coverage (Kover)
        run: >-
          ./gradlew
          :grant-core:koverHtmlReport :grant-core:koverVerify
          :grant-compose:koverHtmlReport
          :grant-contacts:koverHtmlReport
          :grant-calendar:koverHtmlReport
          :grant-motion:koverHtmlReport
          :grant-bluetooth:koverHtmlReport
          :grant-location-always:koverHtmlReport
          :grant-tracking:koverHtmlReport

      - name: Upload KMP Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: kmp-coverage-report
          path: |
            grant-core/build/reports/kover/html
            grant-compose/build/reports/kover/html
            grant-contacts/build/reports/kover/html
            grant-calendar/build/reports/kover/html
            grant-motion/build/reports/kover/html
            grant-bluetooth/build/reports/kover/html
            grant-location-always/build/reports/kover/html
            grant-tracking/build/reports/kover/html
